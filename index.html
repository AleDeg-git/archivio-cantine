<style>
:root{--bg:#EFE8D8;--card:#E6DEC9;--ink:#1b1b1b;--mut:#7a7466;--line:#cfc6b1;--neon:#39FF14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151512;--card:#201f1a;--ink:#EFE8D8;--mut:#9a9482;--line:#35332b}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Mono',ui-monospace,Menlo,monospace;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-family:'Doto',ui-monospace,monospace;font-weight:900;font-size:34px;line-height:1.1;margin:10px 0 14px;word-break:break-word}
.mut{color:var(--mut)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bk{background:none;border:0;color:var(--ink);font:inherit;padding:6px 0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--neon);text-decoration-thickness:3px;text-underline-offset:4px}
.card{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--ink);border-radius:14px;background:var(--card);padding:14px;margin:10px 0;cursor:pointer}
.card:active{background:var(--neon);color:#1b1b1b}
.card:active .mut{color:#1b1b1b}
.btn{font:inherit;font-weight:500;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:10px;padding:11px 14px;margin:6px 6px 6px 0;cursor:pointer}
.pri{background:var(--neon);color:#1b1b1b}
.dng{border-style:dashed}
.in{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px;margin:4px 0 10px}
.in:focus{outline:2px solid var(--neon);border-color:var(--ink)}
.lb{display:block;font-size:13px;color:var(--mut);margin-top:6px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.row b{font-weight:500;text-align:right}
.err{color:#c0392b;min-height:20px;margin:4px 0}
.ft{margin-top:34px;padding-top:14px;border-top:1.5px solid var(--ink);font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}
.ft i{width:10px;height:10px;background:var(--neon);border:1.5px solid var(--ink);border-radius:3px;display:inline-block}

function uid(){return Math.random().toString(36).slice(2,9)}
function load(){try{var r=localStorage.getItem(K);if(r)D=JSON.parse(r)}catch(e){}}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function C(){return D.cantine.find(function(x){return x.id==S.c})}
function W(){var c=C();return c&&c.vini.find(function(x){return x.id==S.w})}
function go(v,o){S=Object.assign({},S,o||{},{v:v,del:0});render();window.scrollTo(0,0)}
function bc(b){return '<div class="top"><button class="bk" onclick="'+b+'">‹ Indietro</button></div>'}
function delb(k){return '<button class="btn dng" onclick="del(\''+k+'\')">'+(S.del==k?'Tocca ancora per eliminare':'Elimina')+'</button>'}
function del(k){if(S.del!=k){S.del=k;return render()}
 if(k=='c'){D.cantine=D.cantine.filter(function(x){return x.id!=S.c});save();return go('c')}
 var c=C();c.vini=c.vini.filter(function(x){return x.id!=S.w});save();go(c.vini.some(function(w){return w.anno==S.y})?'v':'a')}
function lst(){var q=(document.getElementById('q').value||'').toLowerCase();
 var r=D.cantine.filter(function(c){return (c.nome+' '+c.zona).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return a.nome.localeCompare(b.nome)});
 document.getElementById('lst').innerHTML=r.length?r.map(function(c){return '<div class="card" onclick="go(\'a\',{c:\''+c.id+'\'})"><span><b>'+esc(c.nome)+'</b><br><span class="mut">'+esc(c.zona)+'</span></span><span class="mut">'+c.vini.length+' ›</span></div>'}).join(''):'<p class="mut">Nessuna cantina. Aggiungine una oppure carica i dati di prova da Dati.</p>'}
function form(k){S.pv=S.v;S.f=k;S.del=0;S.v='f';render()}
function fl(id,l,u,v,t){return '<label class="lb">'+l+(u?' ('+u+')':'')+'</label><input class="in" id="f_'+id+'" value="'+esc(v)+'" '+(t||'')+'>'}
function sv(){var g=function(i){return document.getElementById('f_'+i).value.trim()},k=S.f,er=function(m){document.getElementById('err').textContent=m};
 if(k=='c'||k=='ec'){var n=g('nome');if(!n)return er('Inserisci il nome della cantina.');
  if(k=='c'){var c={id:uid(),nome:n,zona:g('zona'),vini:[]};D.cantine.push(c);S.c=c.id}else Object.assign(C(),{nome:n,zona:g('zona')});
  save();return go('a')}
 var an=parseInt(g('anno')),nm=g('nome');if(!(an>1900&&an<2100)||!nm)return er('Servono un\'annata valida e il nome del vino.');
 var o={anno:an,nome:nm,varieta:g('varieta'),aff:g('aff'),bt:g('bt')};P.forEach(function(p){o[p[0]]=g(p[0]).replace(',','.')});
 if(k=='w'){o.id=uid();C().vini.push(o);S.w=o.id}else Object.assign(W(),o);
 S.y=an;save();go('w')}
function msg(t){var m=document.getElementById('msg');if(m)m.textContent=t}
function exp(){var t=JSON.stringify(D,null,1);document.getElementById('tx').value=t;
 try{var f=new File([t],'archivio-cantine.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return msg('Scegli Salva su File.')}
  var u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;a.click()}catch(e){}
 msg('Se il file non parte, copia il testo qui sotto e incollalo in un file .json.')}
function fil(i){var f=i.files[0];if(!f)return;f.text().then(function(t){document.getElementById('tx').value=t;msg('File letto. Scegli Unisci o Sostituisci.')})}
function imp(mode){try{var j=JSON.parse(document.getElementById('tx').value);
 var n=(j.cantine||[]).map(function(c){return{id:uid(),nome:String(c.nome||''),zona:String(c.zona||''),vini:(c.vini||[]).map(function(w){return Object.assign({},w,{id:uid(),anno:parseInt(w.anno)||0})})}});
 if(mode=='r')D={cantine:n};else n.forEach(function(c){var e=D.cantine.find(function(x){return x.nome==c.nome});
  if(e)c.vini.forEach(function(w){if(!e.vini.some(function(x){return x.anno==w.anno&&x.nome==w.nome}))e.vini.push(w)});else D.cantine.push(c)});
 save();msg('Fatto: '+D.cantine.length+' cantine in archivio.')}catch(e){msg('Formato non valido.')}}
function render(){var a=document.getElementById('app'),h='',c=C(),y=S.y;
 if(S.v=='c'){h='<h1>Cantine</h1><input id="q" class="in" placeholder="Cerca cantina o zona" oninput="lst()"><div id="lst"></div><button class="btn pri" onclick="form(\'c\')">+ Cantina</button><button class="btn" onclick="go(\'x\')">Dati</button>'}
 else if(S.v=='a'){var ys=[];c.vini.forEach(function(v){if(ys.indexOf(v.anno)<0)ys.push(v.anno)});ys.sort(function(p,q){return q-p});
  h=bc("go('c')")+'<h1>'+esc(c.nome)+'</h1><p class="mut">'+esc(c.zona)+'</p>'+(ys.length?ys.map(function(n){return '<div class="card" onclick="go(\'v\',{y:'+n+'})"><b>'+n+'</b><span class="mut">'+c.vini.filter(function(v){return v.anno==n}).length+' vini ›</span></div>'}).join(''):'<p class="mut">Nessun vino ancora.</p>')+'<button class="btn pri" onclick="form(\'w\')">+ Vino</button><button class="btn" onclick="form(\'ec\')">Modifica cantina</button>'+delb('c')}
 else if(S.v=='v'){h=bc("go('a')")+'<h1>'+esc(c.nome)+' '+y+'</h1>'+c.vini.filter(function(v){return v.anno==y}).map(function(v){return '<div class="card" onclick="go(\'w\',{w:\''+v.id+'\'})"><span><b>'+esc(v.nome)+'</b><br><span class="mut">'+esc(v.varieta)+'</span></span><span class="mut">›</span></div>'}).join('')+'<button class="btn pri" onclick="form(\'w\')">+ Vino</button>'}
 else if(S.v=='w'){var v=W();h=bc("go('v')")+'<h1>'+esc(v.nome)+'</h1><p class="mut">'+esc(c.nome)+', '+v.anno+'</p><div class="row"><span>Varietà</span><b>'+esc(v.varieta||'–')+'</b></div><div class="row"><span>Affinamento</span><b>'+esc(v.aff||'–')+'</b></div><div class="row"><span>Bottiglie prodotte</span><b>'+esc(v.bt||'–')+'</b></div>'+P.map(function(p){return '<div class="row"><span>'+p[1]+'</span><b>'+(v[p[0]]?esc(v[p[0]])+(p[2]?' '+p[2]:''):'–')+'</b></div>'}).join('')+'<p></p><button class="btn pri" onclick="form(\'ew\')">Modifica</button>'+delb('w')}
 else if(S.v=='f'){var k=S.f,isC=k=='c'||k=='ec',e=k=='ec'?c:k=='ew'?W():{};
  h=bc('go(S.pv)')+'<h1>'+(isC?(k=='c'?'Nuova cantina':'Cantina'):(k=='w'?'Nuovo vino':'Modifica vino'))+'</h1>'+(isC?fl('nome','Nome cantina','',e.nome)+fl('zona','Zona vitivinicola','',e.zona):fl('anno','Annata','',e.anno||S.y||'','inputmode="numeric"')+fl('nome','Nome vino','',e.nome)+fl('varieta','Varietà','',e.varieta)+fl('aff','Affinamento (contenitore)','',e.aff)+fl('bt','Bottiglie prodotte','n.',e.bt,'inputmode="numeric"')+P.map(function(p){return fl(p[0],p[1],p[2],e[p[0]],'inputmode="decimal"')}).join(''))+'<p class="err" id="err"></p><button class="btn pri" onclick="sv()">Salva</button><button class="btn" onclick="go(S.pv)">Annulla</button>'}
 else if(S.v=='x'){h=bc("go('c')")+'<h1>Dati</h1><p class="mut">I dati restano solo su questo dispositivo. Esporta un backup ogni tanto.</p><button class="btn pri" onclick="exp()">Esporta</button><label class="lb">Importa da file</label><input class="in" type="file" accept=".json,application/json" onchange="fil(this)"><textarea id="tx" class="in" placeholder="Qui compare il contenuto del backup"></textarea><button class="btn" onclick="imp(\'u\')">Unisci</button><button class="btn" onclick="imp(\'r\')">Sostituisci</button><p id="msg" class="mut"></p>'}
 a.innerHTML=h;if(S.v=='c')lst()}
load();render();
</script></body></html>
